<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanning - Web Security Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-800 mb-4">
                <i class="fas fa-shield-alt text-blue-600 mr-2"></i>
                Scanning in Progress
            </h1>
            <p class="text-gray-600 text-lg">Analyzing website security...</p>
        </header>

        <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-lg p-8">
            <div class="mb-8">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Scanning URL:</h2>
                <p id="scanUrl" class="text-blue-600 break-all"></p>
            </div>

            <!-- Progress Section -->
            <div id="progress" class="mb-8">
                <div class="mb-6">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-semibold text-gray-700">Overall Progress</span>
                        <span id="progressPercentage" class="text-sm text-blue-600">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Scan Stages -->
                <div class="space-y-4">
                    <div id="xssStage" class="flex items-center">
                        <i class="fas fa-code text-yellow-500 mr-2"></i>
                        <span class="text-gray-700">XSS Scanning</span>
                        <div class="ml-auto">
                            <i class="fas fa-spinner fa-spin text-blue-500"></i>
                        </div>
                    </div>
                    <div id="sqlStage" class="flex items-center">
                        <i class="fas fa-database text-red-500 mr-2"></i>
                        <span class="text-gray-700">SQL Injection Scanning</span>
                        <div class="ml-auto">
                            <i class="fas fa-spinner fa-spin text-blue-500"></i>
                        </div>
                    </div>
                    <div id="csrfStage" class="flex items-center">
                        <i class="fas fa-random text-purple-500 mr-2"></i>
                        <span class="text-gray-700">CSRF Scanning</span>
                        <div class="ml-auto">
                            <i class="fas fa-spinner fa-spin text-blue-500"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const url = urlParams.get('url');
        document.getElementById('scanUrl').textContent = url;

        let progress = 0;
        const progressBar = document.getElementById('progressBar');
        const progressPercentage = document.getElementById('progressPercentage');

        // Start the scan
        fetch('/scan', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `url=${encodeURIComponent(url)}`
        })
        .then(response => response.json())
        .then(data => {
            // Redirect to results page with the scan data
            window.location.href = `/results?data=${encodeURIComponent(JSON.stringify(data))}`;
        })
        .catch(error => {
            console.error('Error:', error);
            alert('An error occurred during the scan. Please try again.');
        });

        // Simulate progress updates
        const progressInterval = setInterval(() => {
            if (progress < 90) {
                progress += Math.random() * 10;
                progress = Math.min(progress, 90);
                updateProgress(progress);
            }
        }, 1000);

        function updateProgress(value) {
            progressBar.style.width = `${value}%`;
            progressPercentage.textContent = `${Math.round(value)}%`;
        }
    </script>
</body>
</html>
