<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Security Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-800 mb-4">
                <i class="fas fa-shield-alt text-blue-600 mr-2"></i>
                Web Security Scanner
            </h1>
            <p class="text-gray-600 text-lg">Simple, fast, and reliable web application security testing</p>
        </header>

        <!-- Main Content -->
        <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-lg p-8">
            <!-- URL Input Form -->
            <form id="scanForm" class="mb-8" action="/scan" method="GET">
                <div class="mb-6">
                    <label for="url" class="block text-gray-700 text-sm font-bold mb-2">Website URL to Scan</label>
                    <div class="flex">
                        <input type="url" id="url" name="url" required
                            class="flex-1 shadow appearance-none border rounded-l py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                            placeholder="https://example.com">
                        <button type="submit"
                            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-r transition duration-200">
                            <i class="fas fa-search mr-2"></i>
                            Scan Now
                        </button>
                    </div>
                </div>
            </form>

            <!-- Progress Section (Hidden by default) -->
            <div id="progress" class="hidden">
                <div class="mb-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-semibold text-gray-700">Scanning in progress...</span>
                        <span id="progressPercentage" class="text-sm text-blue-600">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Results Section (Hidden by default) -->
            <div id="results" class="hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">Scan Results</h2>
                <div class="space-y-6">
                    <!-- XSS Vulnerabilities -->
                    <div class="border rounded-lg p-4">
                        <h3 class="text-lg font-semibold text-gray-800 mb-2">
                            <i class="fas fa-code text-yellow-500 mr-2"></i>
                            Cross-Site Scripting (XSS)
                        </h3>
                        <div id="xssResults" class="text-gray-600"></div>
                    </div>

                    <!-- SQL Injection Vulnerabilities -->
                    <div class="border rounded-lg p-4">
                        <h3 class="text-lg font-semibold text-gray-800 mb-2">
                            <i class="fas fa-database text-red-500 mr-2"></i>
                            SQL Injection
                        </h3>
                        <div id="sqlResults" class="text-gray-600"></div>
                    </div>

                    <!-- CSRF Vulnerabilities -->
                    <div class="border rounded-lg p-4">
                        <h3 class="text-lg font-semibold text-gray-800 mb-2">
                            <i class="fas fa-random text-purple-500 mr-2"></i>
                            CSRF
                        </h3>
                        <div id="csrfResults" class="text-gray-600"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    </script>
</body>
</html>
